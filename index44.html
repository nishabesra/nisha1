<html>
	<head>
		<title></title>
		<style type="text/css">
			body{
				/*background-color: red;
				background-image: url('d.jpeg');
				background-repeat: no-repeat;
				background-position: center;
				background-attachment: fixed;
				background: red url('d.jpeg')no-repeat center fixed;*/
				margin:0;	
			}
			#rmenu{
				width:50px;
				height:150px;
				background:blue;
				position:fixed;
				right:0;
				top:100px;
			}
			#mainarea{
				width:1200px;
				height:1500px;
				background:orange;
				margin:0 auto;
			}
			#toparea{
				width:1200px;
				height:150px;
				background:blue;
			}
			#logoarea{
				width:150px;
				height:150px;
				background:yellow;
				float:left;
			}
			#titlearea{
				width:1050px;
				height:150px;
				background:skyblue;
				float:left;
			}
			#menuarea{
				width:1200px;
				height:40px;
				background:green;
				float:left;
				position:sticky;
				top:0;
				z-index:1000;
			}
			#slidearea{
				width:1200px;
				height:600px;
				background:white;
				float:left;
				padding:0;
			}
			#squarearea{
				width:100px;
				height:100px;
				background:black;
			}
			@keyframes square{
				0%{
					background:url('1.png') no-repeat;
				}
				10%{
					background:url('2.png') no-repeat;
				}
				20%{
					background:url('3.png') no-repeat;
				}
				30%{
					background:url('4.png') no-repeat;
				}
				40%{
					background:url('5.png') no-repeat;
				}
				50%{
					background:url('6.png') no-repeat;
				}
				60%{
					background:url('7.png') no-repeat;
				}
				70%{
					background:url('8.png') no-repeat;
				}
				80%{
					background:url('9.png') no-repeat;
				}
				90%{
					background:url('10.png') no-repeat;
				}
				
				100%{
					background:url('11.png') no-repeat;
				}
			}
			#squarearea{
				animation-name:square;
				animation-duration:4s;
				animation-iteration-count:infinite;
				animation-timing-function:ease-in-out;	
			}
			#darea{
				width:1200px;
				height:300px;
				background:silver;
				float:left;
			}
			#leftarea{
				width:500px;
				height:200px;
				background:green;
				float:left;
				margin:50px;
			}
			#rightarea{
				width:500px;
				height:200px;
				background:maroon;
				float:left;
				margin:50px;
			}
			#boxarea{
				width:1200px;
				height:300px;
				background:pink;
				float:left;
			}
			.box{
				width:260px;
				height:160px;
				float:left;
				margin:50px;
				position:relative;
			}
			.box img{
				width:100%;
				height:100%;
			}
			.details{
				position:absolute;
				left:0;
				width:5px;
				height:100%;
				text-align:center;
				background:red;
				color:white;
				font-weight:bold;
				transition:all 2s;
			}
			.box:hover .details{
				height:5%;
			}
			#footerarea{
				width:1200px;
				height:410px;
				background:purple;
				float:left;
			}
			#f1{
				width:300px;
				height:410px;
				background:darkgreen;
				float:left;
			}
			#f2{
				width:300px;
				height:410px;
				background:black;
				float:left;
			}
			#f3{
				width:300px;
				height:410px;
				background:darkred;
				float:left;
			}
			#f4{
				width:300px;
				height:410px;
				background:deeporange;
				float:left;
			}
		</style>
	</head>
	<body>	
		<div id="rmenu">
		</div>
		<div id="mainarea">
			<div id="toparea">
				<div id="logoarea">
				</div>
				<div id="titlearea">
				</div>
			</div>
			<div id="menuarea">
			</div>
			<div id ="slidearea">
				<div id="squarearea">
				</div>
			</div>
			<div id="darea">
				<div id="leftarea">
				</div>
				<div id="rightarea">
				</div>
			</div>
			<div id="boxarea">
				<div class="box">
					<img src="img.jpeg">
					<div class="details">
						
					</div>
				</div>
				<div class="box">
					<img src="img.jpeg">
					<div class="details">
						
					</div>
				</div>
				<div class="box">
					<img src="img.jpeg">
					<div class="details">
						
					</div>
				</div>
			</div>
			<div id="footerarea">
				<div id="f1">
				</div>
				<div id="f2">
				</div>
				<div id="f3">
				</div>
				<div id="f4">
				</div>
			</div>
		</div>
	</body>
</html>
